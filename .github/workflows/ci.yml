name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test the interface
        run: pnpm test

      # The Rust build embeds the built frontend, so it has to exist first.
      - name: Build the frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Build the bundles
        run: TAURI_LINUX_AYATANA_APPINDICATOR=true pnpm app:build

      # The .deb is uninstallable on current Debian and Ubuntu if the bundler
      # picked the old appindicator library instead.
      - name: Check the package dependencies
        run: dpkg-deb -f src-tauri/target/release/bundle/deb/*.deb Depends | grep libayatana-appindicator3-1

      - uses: actions/upload-artifact@v4
        with:
          name: greenhouse-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Rust build embeds the built frontend, so it has to exist first.
      - name: Build the frontend
        run: pnpm build

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Build the installer
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: greenhouse-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
