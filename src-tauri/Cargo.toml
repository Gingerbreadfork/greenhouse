[package]
name = "greenhouse"
version = "0.1.0"
description = "A torrent client for Linux with bulk tracker management"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/Gingerbreadfork/greenhouse"

[lib]
name = "greenhouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "9"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "macros", "net", "io-util"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
url = "2"
bytes = "1"
percent-encoding = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
gtk = "0.18"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio-util = { version = "0.7", features = ["io"] }
roxmltree = "0.20"
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
